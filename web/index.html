<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form - CSC584</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #6a0dad;
            --light-purple: #9b59b6;
            --dark-purple: #4b0082;
            --primary-gold: #ffd700;
            --light-gold: #fff9c4;
            --dark-gold: #fbc02d;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --medium-gray: #e9ecef;
            --dark-gray: #495057;
            --text-dark: #2c3e50;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--gradient);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 0;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(155, 89, 182, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 
                var(--shadow),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-gold), var(--primary-purple));
            border-radius: 4px 4px 0 0;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .header h1 {
            color: var(--dark-purple);
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--dark-purple), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--dark-gray);
            font-size: 1.2rem;
            font-weight: 400;
        }

        .accent-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--primary-gold), var(--primary-purple), var(--light-purple));
            border-radius: 2px;
            margin: 1.5rem auto;
            width: 80px;
            position: relative;
        }

        .accent-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: inherit;
            border-radius: inherit;
            filter: blur(3px);
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: var(--dark-purple);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-container {
            position: relative;
            transition: all 0.3s ease;
        }

        input, select, textarea {
            width: 100%;
            padding: 1.1rem 1.2rem;
            border: 2px solid var(--medium-gray);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: var(--white);
            color: var(--text-dark);
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 
                0 0 0 4px rgba(106, 13, 173, 0.1),
                0 4px 12px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
            background-color: var(--light-gray);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        .input-icon {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dark-gray);
            transition: all 0.3s ease;
            z-index: 2;
        }

        input:focus + .input-icon,
        select:focus + .input-icon {
            color: var(--primary-purple);
            transform: translateY(-50%) scale(1.1);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: var(--dark-purple);
            border: none;
            padding: 1.3rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 8px 25px rgba(255, 215, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .required {
            color: #e74c3c;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'><path fill='%23666' d='M2 0L0 2h4zm0 5L0 3h4z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
            background-size: 0.65rem;
            padding-right: 2.5rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            
            .form-card {
                padding: 2.5rem 1.8rem;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .header p {
                font-size: 1.1rem;
            }
        }

        /* Floating label effect */
        .floating-label {
            position: absolute;
            left: 1.2rem;
            top: 1.1rem;
            background: var(--white);
            padding: 0 0.5rem;
            color: var(--dark-gray);
            font-size: 1rem;
            transition: all 0.3s ease;
            pointer-events: none;
            border-radius: 4px;
        }

        input:focus ~ .floating-label,
        textarea:focus ~ .floating-label,
        input:not(:placeholder-shown) ~ .floating-label,
        textarea:not(:placeholder-shown) ~ .floating-label {
            top: -0.6rem;
            left: 0.8rem;
            font-size: 0.8rem;
            color: var(--primary-purple);
            font-weight: 600;
            background: var(--white);
            padding: 0 0.5rem;
        }

        /* Beautiful focus states */
        .input-container::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-gold), var(--primary-purple));
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        input:focus ~ .input-container::after,
        textarea:focus ~ .input-container::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="header">
                <h1>Personal Profile</h1>
                <div class="accent-bar"></div>
            </div>
            
            <form action="ProfileServlet" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name <span class="required">*</span></label>
                        <div class="input-container">
                            <input type="text" id="name" name="name" required placeholder=" ">
                            <span class="floating-label">Enter your full name</span>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="studentId">Student ID <span class="required">*</span></label>
                        <div class="input-container">
                            <input type="text" id="studentId" name="studentId" required placeholder=" ">
                            <span class="floating-label">Enter your student ID</span>
                            <i class="fas fa-id-card input-icon"></i>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="program">Program <span class="required">*</span></label>
                        <select id="program" name="program" required>
                            <option value="">Select Program</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <div class="input-container">
                            <input type="email" id="email" name="email" required placeholder=" ">
                            <span class="floating-label">Enter your email address</span>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hobbies">Hobbies & Interests</label>
                    <div class="input-container">
                        <textarea id="hobbies" name="hobbies" placeholder=" "></textarea>
                        <span class="floating-label">List your hobbies and interests separated by commas</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="introduction">Self Introduction <span class="required">*</span></label>
                    <div class="input-container">
                        <textarea id="introduction" name="introduction" required placeholder=" "></textarea>
                        <span class="floating-label">Tell us about yourself, your background, and your aspirations...</span>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i> Create Profile
                </button>
            </form>
        </div>
    </div>

    <script>
        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, textarea, select');
            
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('focused');
                });
            });
        });
    </script>
</body>
</html>
